name: Build & Publish Fat Mod

on:
  push:
    branches: [main, master, develop]
    tags: ['*']
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish Fat Mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Two servers:
      #  - github-openent : reads the private parent POM from open-ent/open-ent-ng (PAT, read:packages)
      #  - github         : publishes this mod's fat JAR (automatic GITHUB_TOKEN)
      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github-openent</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.OPENENT_PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build fat JAR
        env:
          OPENENT_PACKAGES_TOKEN: ${{ secrets.OPENENT_PACKAGES_TOKEN }}
        run: mvn clean package -DskipTests -B

      - name: Run tests
        if: github.event_name == 'pull_request'
        env:
          OPENENT_PACKAGES_TOKEN: ${{ secrets.OPENENT_PACKAGES_TOKEN }}
        run: mvn test -B

      - name: Publish fat JAR to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          GROUP_ID=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          FAT_JAR="target/${ARTIFACT_ID}-${VERSION}-fat.jar"
          echo "Publishing ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}:fat"
          if [ ! -f "${FAT_JAR}" ]; then
            echo "::error::Fat JAR not found at ${FAT_JAR}"
            ls -la target/*.jar 2>/dev/null || echo "No JARs found in target/"
            exit 1
          fi
          mvn deploy:deploy-file \
            -Dfile="${FAT_JAR}" \
            -DgroupId="${GROUP_ID}" \
            -DartifactId="${ARTIFACT_ID}" \
            -Dversion="${VERSION}" \
            -Dclassifier=fat \
            -Dpackaging=jar \
            -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/${{ github.repository }}" \
            -B

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/*-fat.jar
          generate_release_notes: true
